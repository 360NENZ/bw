<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1549b8">
    <meta name="description" content="Bilibili World 2026 非官方倒计时。次元新航线，和热爱一起出发。">
    <title>Bilibili World 2026 · 次元新航线</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/bw-2026-poster.jpg" as="image">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#countdown">跳转到倒计时</a>
    <div class="background" aria-hidden="true">
        <video id="backgroundVideo" class="background-video" loop muted playsinline preload="none"
            poster="assets/bw-2026-poster.jpg" data-src="assets/bw-2026-banner.mp4" tabindex="-1"></video>
    </div>
    <div class="page-shell">
        <header class="site-header">
            <a class="site-brand" href="./" aria-label="BW 2026 倒计时首页">
                <span class="brand-mark">BW<span>2026</span></span>
                <span class="brand-caption">次元新航线<span>非官方纪念页面</span></span>
            </a>
            <nav class="page-tools" aria-label="页面工具">
                <button class="tool-button" id="motionBtn" type="button" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path id="motionIcon" d="M9 5v14M15 5v14"/></svg>
                    <span id="motionLabel">暂停背景</span>
                </button>
                <button class="tool-button fullscreen-control" id="fullscreenBtn" type="button" aria-label="进入全屏" title="进入全屏" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
                </button>
            </nav>
        </header>
        <main class="main-content">
            <section class="boarding-pass" id="countdown" aria-labelledby="eventTitle" tabindex="-1">
                <div class="event-info">
                    <div class="event-meta"><span class="flight-tag">BW 2026</span><span>和热爱一起出发</span></div>
                    <h1 id="eventTitle">Bilibili World <span>2026</span></h1>
                    <p class="event-location"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>上海 · 国家会展中心</p>
                    <p class="event-date"><time datetime="2026-07-10">2026.07.10</time><span>—</span><time datetime="2026-07-12">07.12</time><span class="timezone">北京时间</span></p>
                </div>
                <div class="countdown-panel">
                    <div class="countdown-heading">
                        <h2 id="countdownTitle">距离开场还有</h2>
                        <span class="event-status" id="eventStatus" role="status">准备启航</span>
                    </div>
                    <div class="timer-grid" role="timer" aria-labelledby="countdownTitle" aria-live="off">
                        <div class="time-box"><span class="time-value" id="days">000</span><span class="time-label">天</span></div>
                        <span class="time-separator" aria-hidden="true">:</span>
                        <div class="time-box"><span class="time-value" id="hours">00</span><span class="time-label">时</span></div>
                        <span class="time-separator" aria-hidden="true">:</span>
                        <div class="time-box"><span class="time-value" id="minutes">00</span><span class="time-label">分</span></div>
                        <span class="time-separator" aria-hidden="true">:</span>
                        <div class="time-box"><span class="time-value" id="seconds">00</span><span class="time-label">秒</span></div>
                    </div>
                    <div class="countdown-bottom">
                        <p id="countdownNote">下一站，与你在现场相见。</p>
                        <a class="official-link" href="https://bw.bilibili.com/#/" target="_blank" rel="noopener noreferrer">前往官网<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg><span class="sr-only">（在新标签页打开）</span></a>
                    </div>
                </div>
            </section>
            <noscript><p class="noscript-note">启用 JavaScript 后可查看实时计时。活动日期：2026 年 7 月 10 日至 12 日。</p></noscript>
        </main>
        <footer class="site-footer">
            <p>热爱不散场，次元再相逢。</p>
            <p>非官方页面 · 视觉素材来自 BW 官网<span class="credit">制作鸣谢：lrastar / Gemini3 Pro</span></p>
        </footer>
    </div>
    <p class="feedback" id="feedback" role="status" hidden></p>
</body>
</html>
